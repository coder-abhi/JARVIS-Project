<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" rx="80" fill="#0A0E14"/>

  <!-- Outer ring dim -->
  <circle cx="250" cy="250" r="185" fill="none" stroke="#00E5FF" stroke-width="1.2" opacity="0.2"/>
  <!-- Mid ring -->
  <circle cx="250" cy="250" r="135" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.45"/>
  <!-- Inner ring -->
  <circle cx="250" cy="250" r="85" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.85"/>
  <!-- Core glow ring -->
  <circle cx="250" cy="250" r="38" fill="#00E5FF" opacity="0.12"/>
  <!-- Core -->
  <circle cx="250" cy="250" r="22" fill="#00E5FF" opacity="0.92"/>
  <!-- Core cutout -->
  <circle cx="250" cy="250" r="8" fill="#0A0E14"/>

  <!-- Cardinal ticks - top -->
  <line x1="250" y1="55" x2="250" y2="80" stroke="#00E5FF" stroke-width="3" opacity="0.75" stroke-linecap="round"/>
  <!-- Cardinal ticks - bottom -->
  <line x1="250" y1="420" x2="250" y2="445" stroke="#00E5FF" stroke-width="3" opacity="0.75" stroke-linecap="round"/>
  <!-- Cardinal ticks - left -->
  <line x1="55" y1="250" x2="80" y2="250" stroke="#00E5FF" stroke-width="3" opacity="0.75" stroke-linecap="round"/>
  <!-- Cardinal ticks - right -->
  <line x1="420" y1="250" x2="445" y2="250" stroke="#00E5FF" stroke-width="3" opacity="0.75" stroke-linecap="round"/>

  <!-- Diagonal ticks -->
  <line x1="124" y1="124" x2="140" y2="140" stroke="#00E5FF" stroke-width="1.8" opacity="0.4" stroke-linecap="round"/>
  <line x1="376" y1="124" x2="360" y2="140" stroke="#00E5FF" stroke-width="1.8" opacity="0.4" stroke-linecap="round"/>
  <line x1="124" y1="376" x2="140" y2="360" stroke="#00E5FF" stroke-width="1.8" opacity="0.4" stroke-linecap="round"/>
  <line x1="376" y1="376" x2="360" y2="360" stroke="#00E5FF" stroke-width="1.8" opacity="0.4" stroke-linecap="round"/>

  <!-- Cardinal dots -->
  <circle cx="250" cy="65" r="4" fill="#00E5FF" opacity="0.6"/>
  <circle cx="250" cy="435" r="4" fill="#00E5FF" opacity="0.6"/>
  <circle cx="65" cy="250" r="4" fill="#00E5FF" opacity="0.6"/>
  <circle cx="435" cy="250" r="4" fill="#00E5FF" opacity="0.6"/>

  <!-- Corner brackets -->
  <polyline points="90,130 90,90 130,90" fill="none" stroke="#00E5FF" stroke-width="2.5" opacity="0.7" stroke-linecap="square"/>
  <polyline points="410,90 450,90 450,130" fill="none" stroke="#00E5FF" stroke-width="2.5" opacity="0.7" stroke-linecap="square"/>
  <polyline points="90,370 90,410 130,410" fill="none" stroke="#00E5FF" stroke-width="2.5" opacity="0.7" stroke-linecap="square"/>
  <polyline points="410,410 450,410 450,370" fill="none" stroke="#00E5FF" stroke-width="2.5" opacity="0.7" stroke-linecap="square"/>
</svg>
